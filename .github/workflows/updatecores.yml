name: Sync sing-box and Xray cores

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:23 UTC (12:23 Beijing time).
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/sync-cores.yml']

permissions:
  contents: write

concurrency:
  group: sync-node-cores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mirror official stable releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tarfile
          import time
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def api(path):
              return json.loads(gh('api', path))

          def summary(message):
              print(message, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(message + '\n')

          sources = {
              'sing-box': 'SagerNet/sing-box',
              'xray': 'XTLS/Xray-core',
          }
          releases = {}
          for core, source in sources.items():
              release = api(f'repos/{source}/releases/latest')
              if release['draft'] or release['prerelease']:
                  raise RuntimeError(f'{source}: expected a stable published release')
              if not re.fullmatch(r'v?[0-9]+(?:\.[0-9]+){1,3}', release['tag_name']):
                  raise RuntimeError(f'Unexpected version tag: {release["tag_name"]}')
              releases[core] = release

          sb_version = releases['sing-box']['tag_name'].removeprefix('v')
          xr_version = releases['xray']['tag_name'].removeprefix('v')
          tag = f'cores-sb-{sb_version}-xray-{xr_version}'
          existing = subprocess.run(
              ['gh', 'release', 'view', tag, '--json', 'isDraft,assets,url'],
              text=True, capture_output=True,
          )
          expected_names = {
              'sing-box-linux-amd64.tar.gz', 'sing-box-linux-arm64.tar.gz',
              'xray-linux-amd64.zip', 'xray-linux-arm64.zip',
              'manifest.json', 'SHA256SUMS',
          }
          if existing.returncode == 0:
              current = json.loads(existing.stdout)
              if not current['isDraft']:
                  names = {asset['name'] for asset in current['assets']}
                  if not expected_names <= names:
                      raise RuntimeError('Published mirror is incomplete; inspect it before retrying')
                  summary(f'No update needed: sing-box {sb_version}, Xray {xr_version}.')
                  summary(current['url'])
                  raise SystemExit(0)
          elif 'release not found' not in existing.stderr.lower() and 'not found' not in existing.stderr.lower():
              raise RuntimeError(existing.stderr)

          out = Path('mirror-assets')
          out.mkdir()
          manifest = {
              'schema_version': 1,
              'repository': os.environ['GH_REPO'],
              'release_tag': tag,
              'synced_at': datetime.now(timezone.utc).isoformat(),
              'cores': {},
          }

          def download(asset, destination):
              url = asset['browser_download_url']
              if not url.startswith('https://github.com/'):
                  raise RuntimeError('Unexpected upstream download host')
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'argo-core-mirror'})
                      with urllib.request.urlopen(request, timeout=120) as response, destination.open('wb') as f:
                          while chunk := response.read(1024 * 1024):
                              f.write(chunk)
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(3 * (attempt + 1))
              if destination.stat().st_size != asset['size']:
                  raise RuntimeError(f'Size mismatch: {destination.name}')
              digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              # Fail closed: require the SHA-256 digest supplied by GitHub's upstream API.
              if asset.get('digest') != f'sha256:{digest}':
                  raise RuntimeError(f'Upstream SHA-256 unavailable or mismatched: {destination.name}')
              return digest

          for core, release in releases.items():
              entries = {}
              assets = {asset['name']: asset for asset in release['assets']}
              for arch in ('amd64', 'arm64'):
                  if core == 'sing-box':
                      original = f'sing-box-{sb_version}-linux-{arch}.tar.gz'
                      filename = f'sing-box-linux-{arch}.tar.gz'
                      executable = 'sing-box'
                  else:
                      original = 'Xray-linux-64.zip' if arch == 'amd64' else 'Xray-linux-arm64-v8a.zip'
                      filename = f'xray-linux-{arch}.zip'
                      executable = 'xray'
                  if original not in assets:
                      raise RuntimeError(f'Official release is missing {original}')
                  destination = out / filename
                  digest = download(assets[original], destination)
                  if core == 'sing-box':
                      with tarfile.open(destination, 'r:gz') as archive:
                          candidates = [m for m in archive.getmembers() if m.isfile() and Path(m.name).name == executable]
                          if len(candidates) != 1:
                              raise RuntimeError(f'Unexpected archive layout: {original}')
                          with archive.extractfile(candidates[0]) as f:
                              header = f.read(20)
                  else:
                      with zipfile.ZipFile(destination) as archive:
                          if archive.testzip() is not None:
                              raise RuntimeError(f'Corrupt ZIP: {original}')
                          header = archive.read(executable)[:20]
                  expected_machine = 62 if arch == 'amd64' else 183
                  if len(header) < 20 or header[:6] != b'\x7fELF\x02\x01' or int.from_bytes(header[18:20], 'little') != expected_machine:
                      raise RuntimeError(f'Wrong executable architecture: {filename}')
                  entries[arch] = {
                      'filename': filename,
                      'sha256': digest,
                      'size': destination.stat().st_size,
                      'upstream_asset': original,
                      'download_url': f'https://github.com/{os.environ["GH_REPO"]}/releases/download/{tag}/{filename}',
                  }
              manifest['cores'][core] = {
                  'version': release['tag_name'],
                  'upstream_repository': sources[core],
                  'upstream_release': release['html_url'],
                  'assets': entries,
              }

          manifest_file = out / 'manifest.json'
          manifest_file.write_text(json.dumps(manifest, indent=2) + '\n')
          with (out / 'SHA256SUMS').open('w') as f:
              for path in sorted(out.iterdir()):
                  if path.name != 'SHA256SUMS':
                      f.write(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n')

          notes = Path('release-notes.md')
          notes.write_text(
              f'Official stable core mirror\n\n'
              f'- sing-box: {releases["sing-box"]["tag_name"]}\n'
              f'- Xray: {releases["xray"]["tag_name"]}\n'
              f'- Platforms: Linux AMD64 / ARM64\n'
              f'- Original upstream archives; no rebuilding or modifications.\n'
              f'- Downloads checked against upstream API SHA-256 digests.\n'
              f'- manifest.json: versions and immutable download URLs.\n'
              f'- SHA256SUMS: checksums for archives and manifest.\n\n'
              f'Upstream licenses and notices remain applicable.\n'
              f'https://github.com/SagerNet/sing-box\n'
              f'https://github.com/XTLS/Xray-core\n'
          )
          # Upload to a draft first; publish only after every asset is present.
          if existing.returncode != 0:
              gh('release', 'create', tag, '--draft', '--target', os.environ['GITHUB_SHA'],
                 '--title', f'Node cores: sing-box {sb_version} / Xray {xr_version}',
                 '--notes-file', str(notes))
          gh('release', 'upload', tag, *(str(p) for p in sorted(out.iterdir())), '--clobber')
          gh('release', 'edit', tag, '--draft=false', '--latest', '--notes-file', str(notes))
          summary(f'Synced sing-box {sb_version} and Xray {xr_version} (AMD64 / ARM64).')
          summary(f'https://github.com/{os.environ["GH_REPO"]}/releases/tag/{tag}')
          PY
